name: Release (Windows + Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.0'
        required: true
        type: string
      reuse_windows:
        description: 'Retry using signed Windows packages already in this draft release'
        required: false
        default: false
        type: boolean
      linux_run_id:
        description: 'Retry using linux-VERSION artifact from a completed Linux build run'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate one version for both platforms
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-version.mjs "$RELEASE_TAG"
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            jq -e '.isDraft == true' release-state.json
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "LCD Proxy $RELEASE_TAG · Windows / Linux" \
              --notes 'Windows and Linux packages are being built.'
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore Windows installer for a release retry
        if: ${{ inputs.reuse_windows == true }}
        shell: pwsh
        run: gh release download $env:RELEASE_TAG --pattern '*.msi' --dir reused-windows
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.reuse_windows != true }}
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        if: ${{ inputs.reuse_windows != true }}
        with:
          workspaces: './src-tauri -> target'
      - name: Download and verify Windows core
        if: ${{ inputs.reuse_windows != true }}
        shell: pwsh
        run: |
          $ver = (Get-Content scripts/sing-box-version -Raw).Trim()
          $asset = "sing-box-$ver-windows-amd64.zip"
          $line = Get-Content scripts/sing-box-checksums.sha256 | Where-Object { $_.EndsWith("  $asset") }
          if (-not $line) { throw "Missing pinned digest for $asset" }
          $expected = ($line -split '\s+')[0]
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$ver/$asset" -OutFile sing-box.zip
          if ((Get-FileHash sing-box.zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Core SHA-256 mismatch' }
          Expand-Archive sing-box.zip -DestinationPath sing-box-tmp
          $exe = Get-ChildItem -Recurse sing-box-tmp -Filter sing-box.exe | Select-Object -First 1
          if (-not $exe) { throw 'Core executable not found' }
          Copy-Item $exe.FullName src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe
          & src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe version
          if ($LASTEXITCODE -ne 0) { throw 'Core executable cannot run' }
      - run: npm ci
        if: ${{ inputs.reuse_windows != true }}
      - run: npm test
        if: ${{ inputs.reuse_windows != true }}
      - name: Build and sign Windows installers in draft release
        if: ${{ inputs.reuse_windows != true }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'LCD Proxy ${{ needs.prepare.outputs.tag }} · Windows / Linux'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc
      - name: Verify installer product version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          REUSE_WINDOWS: ${{ inputs.reuse_windows }}
        run: |
          $msiDir = if ($env:REUSE_WINDOWS -eq 'true') { 'reused-windows' } else { 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi' }
          $msi = Get-ChildItem $msiDir -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI installer missing' }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi.FullName, 0)
          $view = $db.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'ProductVersion'")
          $view.Execute()
          $record = $view.Fetch()
          $actual = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, @(1))
          if ($actual -ne $env:EXPECTED_VERSION) { throw "MSI version mismatch: $actual" }
          Write-Host "MSI version verified: $actual"

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.linux_run_id == '' }}
      - uses: swatinem/rust-cache@v2
        if: ${{ inputs.linux_run_id == '' }}
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux dependencies
        if: ${{ inputs.linux_run_id == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libcap2-bin patchelf libglib2.0-bin gsettings-desktop-schemas \
            dconf-gsettings-backend dbus
      - name: Build .deb and AppImage
        if: ${{ inputs.linux_run_id == '' }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash scripts/build-linux.sh
      - name: Rust and isolated desktop proxy tests
        if: ${{ inputs.linux_run_id == '' }}
        run: |
          cargo test --locked --release --target x86_64-unknown-linux-gnu --manifest-path src-tauri/Cargo.toml
          test_config_dir=$(mktemp -d)
          XDG_CONFIG_HOME="$test_config_dir" XDG_CURRENT_DESKTOP=X-Cinnamon dbus-run-session -- \
            cargo test --locked --release --target x86_64-unknown-linux-gnu --manifest-path src-tauri/Cargo.toml \
            desktop_proxy_restores_after_reconnect_and_crash -- --ignored --nocapture
      - name: Restore completed Linux build for a release retry
        if: ${{ inputs.linux_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ needs.prepare.outputs.version }}
          path: artifacts/linux/
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ needs.prepare.outputs.version }}
          path: |
            artifacts/linux/*.deb
            artifacts/linux/*.AppImage
            artifacts/linux/SHA256SUMS
          if-no-files-found: error

  linux-smoke:
    needs: [prepare, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ needs.prepare.outputs.version }}
          path: artifacts/linux/
      - name: Install desktop test dependencies and package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox python3-pyatspi python3-gi gir1.2-gtk-3.0 xdotool curl
          deb_file=$(find artifacts/linux -maxdepth 1 -name '*.deb' -print -quit)
          sudo apt-get install -y "$(realpath "$deb_file")"
      - name: Verify both Linux packages on Mint's Ubuntu base
        env:
          LCD_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          image_file=$(find artifacts/linux -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$image_file"
          image_file=$(realpath "$image_file")
          for package in deb appimage; do
            test_dir="$RUNNER_TEMP/lcd-proxy-$package"
            mkdir -p "$test_dir/config" "$test_dir/data"
            if [ "$package" = appimage ]; then
              export LCD_APPIMAGE_PATH="$image_file"
            else
              unset LCD_APPIMAGE_PATH
            fi
            LCD_RELEASE_TEST_DIR="$test_dir" DISPLAY=:95 XDG_CONFIG_HOME="$test_dir/config" \
              XDG_DATA_HOME="$test_dir/data" XDG_CURRENT_DESKTOP=X-Cinnamon \
              dbus-run-session -- python3 -u scripts/test-linux-release.py > "$test_dir/test.log" 2>&1 || {
                cat "$test_dir/test.log"
                cat "$test_dir/client.log"
                exit 1
              }
            cat "$test_dir/test.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/lcd-proxy-*/

  publish:
    needs: [prepare, windows, linux, linux-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ needs.prepare.outputs.version }}
          path: release-assets/
      - name: Install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Assemble and verify all packages
        run: |
          gh release download "$RELEASE_TAG" --pattern '*.msi' --pattern '*.exe' \
            --pattern '*.sig' --pattern latest.json --dir release-assets
          node scripts/prepare-release.mjs release-assets
      - name: Publish one complete release
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "LCD Proxy $RELEASE_TAG · Windows / Linux" \
            --notes-file artifacts/release-notes.md
